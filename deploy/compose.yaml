name: personal-ai-assistant

x-runtime-defaults: &runtime-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  assistant-api:
    <<: *runtime-defaults
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-120}
    image: personal-ai-assistant-api:${ASSISTANT_IMAGE_TAG:-0.1.0}
    environment:
      ASSISTANT_ENVIRONMENT: production
      ASSISTANT_LOG_LEVEL: ${ASSISTANT_LOG_LEVEL:-INFO}
      ASSISTANT_LOG_JSON: "true"
      ASSISTANT_CORS_ORIGINS: ${ASSISTANT_CORS_ORIGINS:-https://assistant.example.com}
      ASSISTANT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-assistant}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-assistant}
      ASSISTANT_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      ASSISTANT_ADMIN_USERNAME: ${ASSISTANT_ADMIN_USERNAME:-admin}
      ASSISTANT_ADMIN_PASSWORD: ${ASSISTANT_ADMIN_PASSWORD:?ASSISTANT_ADMIN_PASSWORD is required}
      ASSISTANT_SECRET_KEY: ${ASSISTANT_SECRET_KEY:?ASSISTANT_SECRET_KEY is required}
      ASSISTANT_PUBLIC_URL: ${ASSISTANT_PUBLIC_URL:-https://127.0.0.1:18000}
      ASSISTANT_MEMORY_ENABLED: ${ASSISTANT_MEMORY_ENABLED:-true}
      ASSISTANT_MEMORY_EMBEDDING_MODEL: ${ASSISTANT_MEMORY_EMBEDDING_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - generated_files:/data/generated
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    cap_drop:
      - ALL
    networks:
      - edge_net
      - app_net
      - data_net

  admin-api:
    <<: *runtime-defaults
    image: personal-ai-assistant-api:${ASSISTANT_IMAGE_TAG:-0.1.0}
    command:
      - uvicorn
      - assistant_app.admin_main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
    environment:
      ASSISTANT_ENVIRONMENT: production
      ASSISTANT_LOG_LEVEL: ${ASSISTANT_LOG_LEVEL:-INFO}
      ASSISTANT_LOG_JSON: "true"
      ASSISTANT_CORS_ORIGINS: ${ASSISTANT_CORS_ORIGINS:-https://assistant.example.com}
      ASSISTANT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-assistant}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-assistant}
      ASSISTANT_REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      ASSISTANT_ADMIN_USERNAME: ${ASSISTANT_ADMIN_USERNAME:-admin}
      ASSISTANT_ADMIN_PASSWORD: ${ASSISTANT_ADMIN_PASSWORD:?ASSISTANT_ADMIN_PASSWORD is required}
      ASSISTANT_SECRET_KEY: ${ASSISTANT_SECRET_KEY:?ASSISTANT_SECRET_KEY is required}
      ASSISTANT_MEMORY_ENABLED: ${ASSISTANT_MEMORY_ENABLED:-true}
      ASSISTANT_MEMORY_EMBEDDING_MODEL: ${ASSISTANT_MEMORY_EMBEDDING_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    cap_drop:
      - ALL
    networks:
      - edge_net
      - app_net
      - data_net

  postgres:
    <<: *runtime-defaults
    build:
      context: ..
      dockerfile: docker/postgres/Dockerfile
    image: personal-ai-assistant-postgres:${POSTGRES_IMAGE_TAG:-pg16-trixie-age1.6-vector0.8.6}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assistant}
      POSTGRES_USER: ${POSTGRES_USER:-assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data_net

  redis:
    <<: *runtime-defaults
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping 2>/dev/null | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - redis_data:/data
    networks:
      - data_net

  minio:
    <<: *runtime-defaults
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-assistant-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-before-enabling-storage}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - data_net

  nginx:
    <<: *runtime-defaults
    image: nginx:stable-alpine
    depends_on:
      assistant-api:
        condition: service_healthy
      admin-api:
        condition: service_healthy
    ports:
      - "0.0.0.0:${ASSISTANT_API_PORT:-18000}:18000"
      - "0.0.0.0:${ASSISTANT_ADMIN_PORT:-19000}:19000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/assistant.crt:/etc/nginx/certs/assistant.crt:ro
      - ./certs/assistant.key:/etc/nginx/certs/assistant.key:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m,noexec,nosuid
      - /var/run:size=4m,noexec,nosuid
      - /tmp:size=16m,noexec,nosuid
    networks:
      - edge_net
      - app_net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  generated_files:

networks:
  edge_net:
  app_net:
  data_net:
    internal: true
