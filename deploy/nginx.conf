worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $request_id [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    limit_req_zone $binary_remote_addr zone=user_auth:10m rate=12r/m;
    limit_req_zone $binary_remote_addr zone=admin_auth:10m rate=6r/m;

    upstream assistant_backend {
        server assistant-api:8000;
        keepalive 16;
    }

    upstream admin_backend {
        server admin-api:8000;
        keepalive 8;
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_certificate /etc/nginx/certs/assistant.crt;
    ssl_certificate_key /etc/nginx/certs/assistant.key;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    server {
        listen 18000 ssl;
        server_name _;
        client_max_body_size 20m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location = /api/v1/auth/login {
            limit_req zone=user_auth burst=8 nodelay;
            proxy_pass http://assistant_backend;
        }

        location = /api/v1/auth/register {
            limit_req zone=user_auth burst=4 nodelay;
            proxy_pass http://assistant_backend;
        }

        location / {
            proxy_pass http://assistant_backend;
        }
    }

    server {
        listen 19000 ssl;
        server_name _;
        client_max_body_size 10m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location = /api/v1/admin/auth/login {
            limit_req zone=admin_auth burst=3 nodelay;
            proxy_pass http://admin_backend;
        }

        location / {
            proxy_pass http://admin_backend;
        }
    }
}
