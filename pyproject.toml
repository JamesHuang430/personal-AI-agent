[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-ai-assistant"
version = "0.1.0"
description = "A self-hosted, tool-enabled personal AI assistant foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "cryptography>=45,<47",
    "fastapi>=0.116,<1",
    "openai>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "redis>=6.4,<8",
    "sqlalchemy[asyncio]>=2.0.43,<3",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
model = []
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["assistant_app*"]

[tool.setuptools.package-data]
assistant_app = ["web/**/*.html", "web/**/*.css", "web/**/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
